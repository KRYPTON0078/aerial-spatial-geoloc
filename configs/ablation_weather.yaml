# Ablation: WeatherPrompt-style synthetic weather (fog/rain/night/snow) at train time.
experiment_name: ablation_weather

model:
  backbone: tiny_cnn
  encoder: shared
  embed_dim: 128
  pretrained: false

loss:
  name: infonce_id
  temperature: 0.07
  id_weight: 0.5
  infonce_weight: 1.0

data:
  dataset: demo
  root: data/demo
  image_size: 64
  query_view: drone
  gallery_view: satellite
  weather_aug: true
  weather_types: [fog, rain, night, snow]
  weather_prob: 0.8

train:
  epochs: 5
  batch_size: 16
  lr: 0.001
  seed: 42
  output_dir: outputs/ablation_weather
  device: auto
  deterministic: true

eval:
  recall_ks: [1, 5, 10]
