experiment_name: demo

model:
  backbone: tiny_cnn
  encoder: shared
  embed_dim: 128
  pretrained: false
  dropout: 0.0

loss:
  name: infonce_id
  temperature: 0.07
  id_weight: 0.5
  infonce_weight: 1.0

data:
  dataset: demo
  root: data/demo
  image_size: 64
  query_view: drone
  gallery_view: satellite
  weather_aug: false
  weather_prob: 0.5
  demo_train_locations: 16
  demo_test_locations: 8
  demo_drones_per_location: 6
  demo_streets_per_location: 2

train:
  epochs: 5
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  seed: 42
  num_workers: 0
  device: auto
  output_dir: outputs/demo
  log_interval: 5
  eval_every: 1
  save_every: 1
  amp: false
  deterministic: true

eval:
  recall_ks: [1, 5, 10]
  batch_size: 32
