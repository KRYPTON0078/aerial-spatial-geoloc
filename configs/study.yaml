experiment_name: sim_study

model:
  backbone: tiny_cnn
  encoder: shared
  embed_dim: 64
  pretrained: false
  dropout: 0.15

loss:
  name: infonce_id
  temperature: 0.07
  id_weight: 0.5
  infonce_weight: 1.0

data:
  dataset: sim
  root: data/sim
  image_size: 64
  query_view: drone
  gallery_view: satellite
  weather_aug: false
  weather_types: [fog, rain, night, snow]
  weather_prob: 0.7
  demo_train_locations: 12
  demo_test_locations: 8
  demo_drones_per_location: 4
  demo_streets_per_location: 1

train:
  epochs: 6
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  seed: 42
  num_workers: 0
  device: cpu
  output_dir: outputs/study_baseline
  log_interval: 20
  eval_every: 1
  save_every: 6
  amp: false
  deterministic: true

eval:
  recall_ks: [1, 5]
  batch_size: 32
