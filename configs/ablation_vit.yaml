# Ablation: tiny ViT backbone (CPU-feasible; not ImageNet-21k ViT-B/16).
experiment_name: ablation_vit

model:
  backbone: vit_tiny
  encoder: shared
  embed_dim: 192
  pretrained: false
  dropout: 0.1

loss:
  name: infonce
  temperature: 0.07
  infonce_weight: 1.0
  id_weight: 0.0

data:
  dataset: demo
  root: data/demo
  image_size: 64
  query_view: drone
  gallery_view: satellite
  weather_aug: false

train:
  epochs: 5
  batch_size: 16
  lr: 0.0005
  seed: 42
  output_dir: outputs/ablation_vit
  device: auto
  deterministic: true

eval:
  recall_ks: [1, 5, 10]
